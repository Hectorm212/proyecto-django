{% extends "inicio/encabezado.html" %}

{% 
    {% block titulo %} Editar Comentario {% endblock titulo %}
%}

{% block encabezado %}
				<!--Encabezdo -->
			<div class="page-header">
				<div class="page-title">
					<h3>Comentarios
				    <small> Editar Comentario </small></h3>
				</div>
			</div>
			<!-- /Encabezado-->
{% endblock encabezado %}

{% block contenido %}
			<!-- Formulario -->
			<form class="form-horizontal" method="POST" role="form" action="{% url 'editar' comentario.id %}">
				{% csrf_token %}
	            <div class="panel panel-default">
	                <div class="panel-body">

				        <div class="form-group">
				            <label class="col-sm-2 control-label text-right">Nombre:</label>
				            <div class="col-sm-10">
				            	<input type="text" class="form-control" name="usuario" value="{{ comentario.usuario }}">
				            </div>
				        </div>
						
                        <div class= "form-group">
				            <label class="col-sm-2 control-label text-right">Mensaje:</label>
                            <div class="col-sm-10">
                                <textarea cols="100" rows="10" name="mensaje" class="form-control">{{ comentario.mensaje }}</textarea>
                            </div>
                        </div>
				        
                        <div class="form-actions text-right">
                        	<input type="submit" value="Editar comentario" class="btn btn-primary">
                            <a href="{% url 'consultarContacto' %}" class="btn btn-secondary">Cancelar</a>
                        </div>

				    </div>
				</div>
			</form>
		<!-- Fin del Formulario -->
		<!-- /Contenido Principal-->
{% endblock %}
